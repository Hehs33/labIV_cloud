<!DOCTYPE html>
<html>
<head>
    <title>Gestión de Tareas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
        }
        .formulario {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #0056b3;
        }
        button.eliminar {
            background-color: #dc3545;
            padding: 5px 10px;
            font-size: 12px;
        }
        button.eliminar:hover {
            background-color: #c82333;
        }
        .tarea {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
            border-left: 4px solid #007bff;
        }
        .tarea.completada {
            opacity: 0.6;
        }
        .tarea h3 {
            margin: 0 0 5px 0;
            text-decoration: none;
        }
        .tarea.completada h3 {
            text-decoration: line-through;
        }
        .tarea p {
            margin: 5px 0;
            color: #666;
        }
        .botones-tarea {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        button.completar {
            background-color: #28a745;
            flex: 1;
            padding: 5px;
            font-size: 12px;
        }
        button.completar:hover {
            background-color: #218838;
        }
        .error {
            color: #dc3545;
            padding: 10px;
            background-color: #f8d7da;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .exito {
            color: #155724;
            padding: 10px;
            background-color: #d4edda;
            border-radius: 4px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>Gestión de Tareas</h1>
    
    <div class="formulario">
        <input id="titulo" placeholder="Título de la tarea" required>
        <input id="descripcion" placeholder="Descripción">
        <button onclick="crearTarea()">Crear Tarea</button>
        <button onclick="cargarTareas()">Cargar Tareas</button>
    </div>

    <div id="mensaje"></div>
    <div id="resultado"></div>

    <script>
        const API_URL = "http://127.0.0.1:8000/tareas";

        async function crearTarea() {
            const titulo = document.getElementById('titulo').value.trim();
            const descripcion = document.getElementById('descripcion').value.trim();
            
            if (!titulo) {
                mostrarMensaje('El título es requerido', 'error');
                return;
            }

            const tarea = {
                titulo: titulo,
                descripcion: descripcion,
                completada: false
            };

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(tarea)
                });

                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('titulo').value = '';
                    document.getElementById('descripcion').value = '';
                    mostrarMensaje('Tarea creada exitosamente', 'exito');
                    cargarTareas();
                } else {
                    mostrarMensaje('Error al crear la tarea', 'error');
                }
            } catch (error) {
                mostrarMensaje('Error de conexión: ' + error.message, 'error');
            }
        }

        async function cargarTareas() {
            try {
                const res = await fetch(API_URL);
                const tareas = await res.json();

                let html = '';
                if (tareas.length === 0) {
                    html = '<p style="text-align: center; color: #999;">No hay tareas</p>';
                } else {
                    tareas.forEach(tarea => {
                        html += `
                            <div class="tarea ${tarea.completada ? 'completada' : ''}">
                                <h3>${tarea.titulo}</h3>
                                <p>${tarea.descripcion}</p>
                                <small>ID: ${tarea.id} | Estado: ${tarea.completada ? 'Completada' : 'Pendiente'}</small>
                                <div class="botones-tarea">
                                    <button class="completar" onclick="actualizarTarea(${tarea.id}, ${!tarea.completada})">
                                        ${tarea.completada ? 'Marcar como pendiente' : 'Marcar como completada'}
                                    </button>
                                    <button class="eliminar" onclick="eliminarTarea(${tarea.id})">Eliminar</button>
                                </div>
                            </div>
                        `;
                    });
                }
                document.getElementById('resultado').innerHTML = html;
                mostrarMensaje('', '');
            } catch (error) {
                mostrarMensaje('Error al cargar tareas: ' + error.message, 'error');
            }
        }

        async function eliminarTarea(id) {
            if (!confirm('¿Eliminar esta tarea?')) return;

            try {
                const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    mostrarMensaje('Tarea eliminada', 'exito');
                    cargarTareas();
                } else {
                    mostrarMensaje('Error al eliminar', 'error');
                }
            } catch (error) {
                mostrarMensaje('Error: ' + error.message, 'error');
            }
        }

        async function actualizarTarea(id, completada) {
            const tareas = await fetch(API_URL).then(r => r.json());
            const tarea = tareas.find(t => t.id === id);

            if (!tarea) {
                mostrarMensaje('Tarea no encontrada', 'error');
                return;
            }

            try {
                const res = await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...tarea, completada })
                });

                if (res.ok) {
                    cargarTareas();
                } else {
                    mostrarMensaje('Error al actualizar', 'error');
                }
            } catch (error) {
                mostrarMensaje('Error: ' + error.message, 'error');
            }
        }

        function mostrarMensaje(texto, tipo) {
            const div = document.getElementById('mensaje');
            if (!texto) {
                div.innerHTML = '';
                return;
            }
            div.innerHTML = `<div class="${tipo}">${texto}</div>`;
        }

        cargarTareas();
    </script>
</body>
</html>
